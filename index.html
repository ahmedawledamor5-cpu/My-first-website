
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon premier site</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eaf4ff;
      color: #243b53;
      text-align: center;
      padding: 60px 20px;
    }

    .carte {
      background: white;
      max-width: 500px;
      margin: auto;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 4px 15px #00000015;
    }

    h1 {
      color: #1769aa;
    }

    a {
      display: inline-block;
      background: #1769aa;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="carte">
    <h1>Bienvenue sur mon site !</h1>
    <img src="images/illustration.svg" alt="Mon premier projet" width="300">
    <p>Je découvre la création de sites web avec GitHub.</p>
    <p>Ceci est mon premier projet personnel.</p>
    <a href="https://github.com/">Découvrir GitHub</a>
  </div>
</body>
</html>
